<head>

    <style>

        /* Home Button */

        /* Card Container */
        .card {
            background-color: #ffffff;

        }

        /* Form Elements */
        .form-group { margin-bottom: 18px; }
        
        label { 
            display: block;

        }
        
        input[type="text"], input[type="email"], select, textarea {
            width: 100%; 
            padding: 14px; 
            box-sizing: border-box; 
            border: 1px solid #ebdcd4;

        input:focus, select:focus, textarea:focus {

        /* Submit Button */
        .submit-btn { 
            background-color: #003823; 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer;

            transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: #012416; }
        .submit-btn:disabled { background-color: #5a7569; cursor: not-allowed; }

        /* Success Message */
        #success-msg { 
            color: #014326; 
            background-color: #d4edda; 
            border: 1px solid #c3e6cb; 
            padding: 12px; 
            border-radius: 8px; 
            display: none; 
            margin-top: 15px;

            font-size: 14px;

</head>
<body>

    <div class="app-container">
        
        <!-- Header Section -->
        <div class="header-container">
            <div class="branding">
                <h2 class="title">💬 Inquiry Form</h2>
            </div>
            <a href="<?= APP_URL ?>?page=index" target="_top" class="home-btn">HOME</a>
        </div>

        <!-- Form Card -->
        <div class="card">
            <form id="inquiryForm">
                <div class="form-group">
                    <label for="Name">Name *</label>
                    <input type="text" id="Name" name="Name" placeholder="e.g., Juan Dela Cruz" required>
                </div>
                
                <div class="form-group">
                    <label for="Email">Contact Info *</label>
                    <input type="email" id="Email" name="Email" placeholder="e.g., 0917 552 7512 or Messenger" required>
                </div>
                
                <div class="form-group">
                    <label for="Inquiry Type">Inquiry Type *</label>
                    <select id="Inquiry Type" name="Inquiry Type" required>
                        <option value="">Select an option...</option>
                        <option value="Printing Services">Printing Services</option>
                        <option value="Reserve a spot">Reserve a spot (school pooling)</option>
                        <option value="Question about product/services">Question about product or services</option>
                        <option value="Follow up on order">Follow up on order</option>
                        <option value="Complaints or suggestions">Complaints or suggestions</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="Message">Message *</label>
                    <textarea id="Message" name="Message" rows="4" placeholder="How can we help you?" required></textarea>
                </div>
            </form>
        </div>

        <!-- Main Action Button -->
        <button type="submit" form="inquiryForm" id="submitBtn" class="submit-btn">Submit Inquiry</button>
        
        <div id="success-msg">Your inquiry has been submitted successfully!</div>
    </div>

    <script>
        const form = document.getElementById('inquiryForm');
        const submitBtn = document.getElementById('submitBtn');
        
        // PASTE YOUR WEB APP URL FROM STEP 2 HERE
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzSjQj9ho3PEq2wgsmWyd68wUMoyX1vhefwE0wQ0Czc2RmFo7Fzarh6gy3KlST2p_UMjw/exec'; 

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    document.getElementById('success-msg').style.display = 'block';
                    form.reset();
                    submitBtn.textContent = 'Submit Inquiry';
                    submitBtn.disabled = false;
                    
                    // Hide message after 5 seconds
                    setTimeout(() => {
                        document.getElementById('success-msg').style.display = 'none';
                    }, 5000);
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    submitBtn.textContent = 'Submit Inquiry';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
